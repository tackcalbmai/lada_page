backend:
  name: github
  repo: tackcalbmai/lada_page
  branch: main
  base_url: https://auth.YOUR_DOMAIN.lv
  auth_endpoint: auth

locale: ru
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: content
    label: Контент сайта
    files:
      - name: site
        label: Основные данные
        file: src/data/site.json
        format: json
        fields:
          - {label: Название, name: brandName, widget: string}
          - {label: Имя мастера, name: artistName, widget: string}
          - {label: Слоган, name: tagline, widget: string}
          - {label: Описание, name: intro, widget: text}
          - {label: Город, name: city, widget: string}
          - {label: WhatsApp, name: whatsappNumber, widget: string}
          - {label: Instagram, name: instagramUrl, widget: string}
      - name: services
        label: Услуги и цены
        file: src/data/services.json
        format: json
        fields:
          - label: Услуги
            name: items
            widget: list
            fields:
              - {label: Название, name: title, widget: string}
              - {label: Описание, name: description, widget: text}
              - {label: Цена, name: price, widget: string}
      - name: portfolio
        label: Портфолио
        file: src/data/portfolio.json
        format: json
        fields:
          - label: Работы
            name: items
            widget: list
            fields:
              - {label: Название, name: title, widget: string}
              - {label: Категория, name: category, widget: select, options: [Работы, Cover-up]}
              - {label: Фото, name: image, widget: image}
              - {label: Описание, name: description, widget: text, required: false}
              - {label: На главную, name: featured, widget: boolean, default: true}
      - name: faq
        label: FAQ
        file: src/data/faq.json
        format: json
        fields:
          - label: Вопросы
            name: items
            widget: list
            fields:
              - {label: Вопрос, name: question, widget: string}
              - {label: Ответ, name: answer, widget: text}
      - name: blog
        label: Блог
        file: src/data/blog.json
        format: json
        fields:
          - label: Статьи
            name: items
            widget: list
            fields:
              - {label: Заголовок, name: title, widget: string}
              - {label: Slug, name: slug, widget: string}
              - {label: Дата, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false}
              - {label: Кратко, name: description, widget: text}
              - {label: Текст, name: body, widget: markdown}
